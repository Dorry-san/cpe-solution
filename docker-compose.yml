services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pme_jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pme_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/pme_jobs?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      GLM_API_KEY: ${ZAI_API_KEY:?Set ZAI_API_KEY in your shell environment}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://api.z.ai/api/v1}
      GLM_MODEL: ${GLM_MODEL:-glm-5.3-flash}
      GLM_REASONING_EFFORT: ${GLM_REASONING_EFFORT:-high}
      GLM_MAX_OUTPUT_TOKENS: ${GLM_MAX_OUTPUT_TOKENS:-8000}
      GLM_TIMEOUT_MS: ${GLM_TIMEOUT_MS:-300000}
      GLM_MAX_RETRIES: ${GLM_MAX_RETRIES:-4}
      CV_UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - cv-uploads:/app/uploads

volumes:
  postgres-data:
  cv-uploads:

